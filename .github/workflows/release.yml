name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v1.0.0)
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with crate version
        id: check
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$tag' is not a vMAJOR.MINOR.PATCH tag"
              exit 1
              ;;
          esac
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: aarch64-apple-darwin
    needs: guard
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package tarball and checksum
        id: package
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          asset="git-better-$VERSION-aarch64-apple-darwin.tar.gz"
          tar -czf "$asset" -C target/aarch64-apple-darwin/release gb
          sha256=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          printf '%s  %s\n' "$sha256" "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  publish:
    name: crates.io
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check for a registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipping the crates.io publish"
          fi

      - name: Publish crate
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  tap:
    name: homebrew tap
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a tap token
        id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping the tap bump"
          fi

      - name: Check out the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Falconiere/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render and push the formula
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          case "$SHA256" in
            *[!0-9a-f]*)
              echo "::error::build checksum is not hexadecimal"
              exit 1
              ;;
          esac
          if [ ${#SHA256} -ne 64 ]; then
            echo "::error::build checksum is not 64 characters"
            exit 1
          fi
          mkdir -p tap/Formula
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA256/g" \
            packaging/homebrew/git-better.rb.tmpl > tap/Formula/git-better.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-better.rb
          if git diff --cached --quiet; then
            echo "::notice::formula already up to date"
            exit 0
          fi
          git commit -m "git-better $VERSION"
          git push
