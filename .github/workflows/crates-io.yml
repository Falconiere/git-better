# Hand-maintained crates.io publish — the one place git-better's release differs
# from Falconiere/comemory, which is never published to a registry. dist owns the
# GitHub Release and the Homebrew formula; this owns `cargo publish`.
#
# Trigger: a release is published, i.e. after the dist `host` job succeeded, so
# the crate is only published once the binaries actually built.
#
# The `secrets` context is unavailable in a job-level `if:`, so the token is
# copied into `env` in a first step and the publish gates on that — a repo
# without CARGO_REGISTRY_TOKEN skips the publish instead of failing the release.

name: crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Check for a registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipping the crates.io publish"
          fi

      - name: Publish crate
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
