# release-plz: Release-PR automation that fronts the dist pipeline.
#
# Two jobs, both on push to `main`:
#   release-plz-pr      — opens/maintains the "release PR" (version bump +
#                         CHANGELOG).
#   release-plz-release — on the merged version-bump commit, pushes the vX.Y.Z
#                         tag (which is what fires release.yml).
#
# Both jobs authenticate with a short-lived GitHub App installation token minted
# from secrets.HOMEBREW_APP_ID / secrets.HOMEBREW_APP_PRIVATE_KEY — the same App
# release.yml uses for the tap push, and the same one that publishes comemory's
# formula. An App token is REQUIRED on the release job: a tag pushed with the
# default GITHUB_TOKEN does NOT trigger downstream workflows, so release.yml
# would never fire. Using it on the release-pr job too means the release PR also
# triggers CI checks. Unlike a PAT it cannot silently expire.
#
# The App must therefore be installed on Falconiere/git-better (not only on
# Falconiere/homebrew-tap) with Contents: read+write and Pull requests:
# read+write. The HOMEBREW_ prefix is now a misnomer here — it is one publish App
# wearing two hats; the secret names are what Infisical syncs, so they stay.
#
# Unlike the tap step in release.yml, these mint steps pass no owner/repositories
# inputs: the action then defaults to the current repository, so each token is
# scoped to git-better alone even though the App can also reach the tap.
#
# Both jobs are gated behind the `RELEASE_PLZ_ENABLED` repo variable — a
# VARIABLE (Actions → Variables), not a secret: the `vars` context cannot see
# secrets, so storing it as a secret silently skips both jobs. Flip it on only
# AFTER the App is installed. See docs/release.md § one-time setup.
#
# config: release-plz.toml (git_release_enable=false, publish=false — dist owns
# build + GitHub Release, crates-io.yml owns the registry publish, release-plz
# owns version + CHANGELOG + tag).

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Open / maintain the release PR.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ vars.RELEASE_PLZ_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # On the merged version bump, push the vX.Y.Z tag (which fires release.yml).
  # The App token is mandatory here — see the header note.
  release-plz-release:
    name: Release-plz release
    if: ${{ vars.RELEASE_PLZ_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
