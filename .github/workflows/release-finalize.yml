# Hand-maintained release finalize workflow — picks up after the
# dist-generated .github/workflows/release.yml finishes a tag build, verifies
# the published tarballs, and fails the run if an artifact is missing or
# malformed. The release itself is already created by the dist-generated `host`
# job.
#
# This file is intentionally NOT generated by `dist init`. Anything added to the
# dist-generated release.yml is clobbered on the next regeneration; the
# additions here live in a separate file.
#
# Trigger: a release is published (stable or prerelease) on GitHub.
# Concurrency: per-tag so a fast re-tag does not collide with the previous run
# for the same tag.

name: Release Finalize

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: release-finalize-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: verify release artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the published tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'git-better-*.tar.xz' \
            --pattern 'git-better-*.tar.xz.sha256' --dir artifacts
          ls -la artifacts/

      - name: Verify tarball layout and size
        env:
          # Every target dist is configured to build. Kept explicit rather than
          # globbed from the download so a target silently missing from the
          # release fails the run instead of passing on the survivors.
          TARGETS: >-
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
        run: |
          # Check each archive is valid, holds the expected binary path, and is
          # a sane size (the release binary alone is ~4 MB). Executing the
          # binaries is a separate step; only the x86_64 Linux one can run here.
          for target in $TARGETS; do
            tarball="artifacts/git-better-${target}.tar.xz"
            if [ ! -f "$tarball" ]; then
              echo "::error::missing release artifact: $(basename "$tarball")"
              exit 1
            fi
            size="$(stat -c%s "$tarball")"
            if [ "$size" -lt 1048576 ]; then
              echo "::error::${target} tarball is suspiciously small: ${size} bytes"
              exit 1
            fi
            tar -tJf "$tarball" | grep -q "^git-better-${target}/gb$" \
              || { echo "::error::expected gb binary not in ${target} tarball"; exit 1; }
            echo "::notice::${target} tarball layout OK (${size} bytes)"
          done

      - name: Verify the checksums match
        env:
          TARGETS: >-
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
        run: |
          cd artifacts
          for target in $TARGETS; do
            archive="git-better-${target}.tar.xz"
            if [ ! -f "${archive}.sha256" ]; then
              echo "::error::missing checksum sidecar: ${archive}.sha256"
              exit 1
            fi
            # dist's sidecar has held both the bare digest and the standard
            # "<digest>  <filename>" form across versions, so take the first
            # field and compare it ourselves rather than assuming
            # `sha256sum --check` can parse the file.
            expected="$(cut -d' ' -f1 "${archive}.sha256")"
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::${target} checksum mismatch: sidecar $expected, computed $actual"
              exit 1
            fi
            echo "::notice::${target} checksum OK ($actual)"
          done

      - name: Smoke-test the Linux x86_64 binary
        run: |
          # This runner is x86_64 Linux, so one of the shipped binaries can
          # actually be executed — the strongest check available here. The
          # other two only get the archive/checksum checks above.
          target=x86_64-unknown-linux-gnu
          tar -xJf "artifacts/git-better-${target}.tar.xz" -C artifacts
          bin="artifacts/git-better-${target}/gb"
          "$bin" --version
          "$bin" --help > /dev/null
          # A real read command against this checkout, in the JSON mode agents
          # use, so a binary that runs but cannot drive `git` still fails.
          "$bin" status --better | python3 -c 'import json,sys; json.load(sys.stdin)' \
            || { echo "::error::gb status --better did not emit valid JSON"; exit 1; }
          echo "::notice::${target} binary runs and drives git"
