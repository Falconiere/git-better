# Hand-maintained release finalize workflow — picks up after the
# dist-generated .github/workflows/release.yml finishes a tag build, verifies
# the published tarball, and fails the run if the artifact is malformed. The
# release itself is already created by the dist-generated `host` job.
#
# This file is intentionally NOT generated by `dist init`. Anything added to the
# dist-generated release.yml is clobbered on the next regeneration; the
# additions here live in a separate file.
#
# Trigger: a release is published (stable or prerelease) on GitHub.
# Concurrency: per-tag so a fast re-tag does not collide with the previous run
# for the same tag.

name: Release Finalize

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: release-finalize-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: verify release artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the published tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'git-better-aarch64-apple-darwin.tar.xz' --dir artifacts
          ls -la artifacts/

      - name: Verify tarball layout and size
        run: |
          # The binary is macOS-only, so a Linux runner cannot execute it; the
          # dist build already proved it compiles and links. Here we only check
          # the archive is valid, holds the expected binary path, and is a sane
          # size (the release binary alone is ~4 MB).
          tarball=artifacts/git-better-aarch64-apple-darwin.tar.xz
          size="$(stat -c%s "$tarball")"
          if [ "$size" -lt 1048576 ]; then
            echo "::error::tarball is suspiciously small: ${size} bytes"
            exit 1
          fi
          tar -tJf "$tarball" | grep -q '^git-better-aarch64-apple-darwin/gb$' \
            || { echo "::error::expected gb binary not in tarball"; exit 1; }
          echo "::notice::tarball layout OK (${size} bytes)"

      - name: Verify the checksum matches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'git-better-aarch64-apple-darwin.tar.xz.sha256' --dir artifacts
          cd artifacts
          # dist's sidecar has held both the bare digest and the standard
          # "<digest>  <filename>" form across versions, so take the first field
          # and compare it ourselves rather than assuming `sha256sum --check`
          # can parse the file.
          expected="$(cut -d' ' -f1 git-better-aarch64-apple-darwin.tar.xz.sha256)"
          actual="$(sha256sum git-better-aarch64-apple-darwin.tar.xz | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::checksum mismatch: sidecar $expected, computed $actual"
            exit 1
          fi
          echo "::notice::checksum OK ($actual)"
