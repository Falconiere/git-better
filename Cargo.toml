[package]
name = "git-better"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Token-lean git companion for humans and LLM agents"
license = "MIT"
repository = "https://github.com/Falconiere/git-better"
homepage = "https://github.com/Falconiere/git-better"
readme = "README.md"
keywords = ["git", "cli", "llm", "agent", "prettier", "syntect"]
categories = ["command-line-utilities", "development-tools", "version-control"]
exclude = [
  "/.github",
  "/tests",
  "/testkit",
  "/docs",
  "/packaging",
  "/.gitignore",
]

[lib]
name = "git_better"
path = "src/lib.rs"

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
owo-colors = "4.1"
terminal_size = "0.3"
unicode-width = "0.1"
syntect = { version = "5.2", features = ["default-fancy", "default-themes", "regex-onig"] }
regex = "1.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.13"
assert_cmd = "2.0"
predicates = "3.1"
testkit = { path = "testkit" }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "Falconiere/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Where to host releases
hosting = "github"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Whether to publish prereleases to package managers
publish-prereleases = false
# Skip checking whether the specified configuration files are up to date.
# release.yml carries two hand-maintained blocks (the preflight gate in `plan`
# and the App-token step in `publish-homebrew-formula`); without this, dist
# reports the file as dirty.
allow-dirty = ["ci"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
