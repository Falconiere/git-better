[workspace]
# Ownership split and rationale: docs/release.md.
# Baseline from git tags, not the registry — works before the crate is published.
git_only = true
# Match the `vX.Y.Z` tag history that release.yml / dist consume.
git_tag_name = "v{{ version }}"
# The tag pushed on release-PR merge is what fires release.yml.
git_tag_enable = true
# dist's `host` job creates the GitHub Release; release-plz must not.
git_release_enable = false
# crates-io.yml owns the registry publish.
publish = false

[changelog]
# Conventional-commit buckets.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Maintenance" },
  { message = "^style", skip = true },
  { message = "^revert", group = "Reverted" },
  { message = "^Merge", skip = true },
]
